name: Publish organic discovery layer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/promotion-retry.yml

permissions:
  contents: write

concurrency:
  group: imaikura-one-off-organic-discovery
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build organic discovery layer
        run: python3 scripts/apply-organic-discovery.py

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/share.js
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import xml.etree.ElementTree as ET
          root=Path('.')
          key='ba7c0e7a8a2f93a3430f16e6994a8c7f'
          assert (root/f'{key}.txt').read_text().strip()==key
          assert (root/'.github/workflows/indexnow.yml').is_file()
          items=ET.parse('feed.xml').getroot().findall('./channel/item')
          assert len(items)>=8
          assert len({item.findtext('link') for item in items})==len(items)
          png=(root/'assets/og-default.png').read_bytes()
          assert png[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',png[16:24])==(1200,630)
          utility={'about/index.html','contact/index.html','privacy/index.html','terms/index.html','site-map/index.html','updates/index.html'}
          for path in root.rglob('*.html'):
              rel=path.as_posix()
              if rel=='404.html': continue
              text=path.read_text(encoding='utf-8')
              assert 'type="application/rss+xml"' in text, rel
              assert 'https://imaikura.com/assets/og-default.png' in text, rel
              assert 'name="twitter:card" content="summary_large_image"' in text, rel
              if rel not in utility:
                  assert 'data-share-box' in text, rel
                  assert 'assets/share.js' in text, rel
          assert 'data-feed-promo' in Path('site-map/index.html').read_text(encoding='utf-8')
          assert 'data-feed-promo' in Path('updates/index.html').read_text(encoding='utf-8')
          print('organic discovery validation: PASS')
          PY

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "imaikura-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/promotion-retry.yml scripts/apply-organic-discovery.py
          git add -A
          git commit -m "Add search discovery, RSS and social sharing"
          git push

      - name: Submit URLs to IndexNow after deployment
        shell: bash
        run: |
          set -u
          key='ba7c0e7a8a2f93a3430f16e6994a8c7f'
          for i in $(seq 1 24); do
            if curl -fsS "https://imaikura.com/${key}.txt" | grep -q "$key"; then break; fi
            sleep 10
          done
          python3 - <<'PY' > /tmp/indexnow-initial.json
          import json, xml.etree.ElementTree as ET
          key='ba7c0e7a8a2f93a3430f16e6994a8c7f'
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[e.text.strip() for e in ET.parse('sitemap.xml').findall('s:url/s:loc',ns)]
          print(json.dumps({'host':'imaikura.com','key':key,'keyLocation':f'https://imaikura.com/{key}.txt','urlList':urls},ensure_ascii=False))
          PY
          code=$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' --data-binary @/tmp/indexnow-initial.json https://api.indexnow.org/indexnow || true)
          if [ "$code" = "200" ] || [ "$code" = "202" ]; then echo "IndexNow accepted ($code)"; else echo "IndexNow notification deferred ($code); deployment remains valid."; fi
