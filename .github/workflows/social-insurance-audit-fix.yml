name: Apply audited 2026 social-insurance effective-month fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/social-insurance-audit-fix.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/audit-payload/social-2026.part* | base64 --decode > /tmp/social.patch.gz
          echo "f7b29203c50ece74c78f86349e1ae88cf010bc0e5e4a5e4c50e0c9e3994c31e2  /tmp/social.patch.gz" | sha256sum -c -
          gzip -dc /tmp/social.patch.gz > /tmp/social.patch
          echo "95f221ec274a26209c151f72de7e9ce8f813778fa5449d59dc4432de4c75cb6c  /tmp/social.patch" | sha256sum -c -
          git apply --check /tmp/social.patch
          git apply /tmp/social.patch

      - name: Run calculation and content regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/tax-engine.js
          node <<'NODE'
          'use strict';
          const tax=require('./assets/tax-engine.js');
          const assert=require('node:assert/strict');
          assert.equal(Object.keys(tax.HEALTH_RATES_2025).length,47);
          assert.equal(Object.keys(tax.HEALTH_RATES_2026).length,47);
          assert.deepEqual([tax.HEALTH_RATES_2025['北海道'],tax.HEALTH_RATES_2025['東京都'],tax.HEALTH_RATES_2025['沖縄県']],[10.31,9.91,9.44]);
          assert.deepEqual([tax.HEALTH_RATES_2026['北海道'],tax.HEALTH_RATES_2026['東京都'],tax.HEALTH_RATES_2026['沖縄県']],[10.28,9.85,9.44]);
          assert.equal(tax.roundEmployeeShare(12345.50),12345);
          assert.equal(tax.roundEmployeeShare(12345.51),12346);
          const jan=tax.contributionRates(2026,1,'東京都',40);
          const mar=tax.contributionRates(2026,3,'東京都',40);
          const apr=tax.contributionRates(2026,4,'東京都',40);
          assert.deepEqual([jan.healthRatePercent,jan.careRatePercent,jan.supportRatePercent,jan.employmentRatePercent],[9.91,1.59,0,0.55]);
          assert.deepEqual([mar.healthRatePercent,mar.careRatePercent,mar.supportRatePercent,mar.employmentRatePercent],[9.85,1.62,0,0.55]);
          assert.deepEqual([apr.healthRatePercent,apr.careRatePercent,apr.supportRatePercent,apr.employmentRatePercent],[9.85,1.62,0.23,0.50]);
          assert.equal(tax.contributionRates(2027,1,'東京都',30).year,2026);
          const salary=tax.socialInsurance2026({monthlySalary:300000,annualBonus:600000,bonusPayments:2,bonusMonths:[6,12],age:30,prefecture:'東京都'});
          assert.deepEqual([salary.health,salary.care,salary.childSupport,salary.pension,salary.employment,salary.total],[207030,0,3795,384300,21450,616575]);
          const age40=tax.socialInsurance2026({monthlySalary:300000,annualBonus:0,bonusPayments:2,bonusMonths:[6,12],age:40,prefecture:'東京都'});
          assert.equal(age40.care,29070);
          for(const [month,expected] of Object.entries({2:[491158,87930,9.91,0,0.55],3:[491330,87750,9.85,0,0.55],4:[490956,88140,9.85,0.23,0.50],6:[490956,88140,9.85,0.23,0.50]})){
            const r=tax.bonusTakeHome2026({bonus:600000,previousSalary:300000,paymentMonth:Number(month),prefecture:'東京都',age:30,dependents:0,declarationFiled:true});
            assert.deepEqual([r.net,r.socialTotal,r.healthRatePercent,r.supportRatePercent,r.employmentRatePercent],expected);
          }
          const cap=tax.bonusTakeHome2026({bonus:600000,previousSalary:300000,paymentMonth:6,prefecture:'東京都',age:30,dependents:0,declarationFiled:true,healthCumulativeBefore:5500000,pensionSameMonthBefore:1400000});
          assert.equal(cap.healthBonusBase,230000);
          assert.equal(cap.pensionBonusBase,100000);
          const takeHome=tax.takeHome2026({monthlySalary:300000,annualBonus:600000,bonusPayments:2,bonusMonths:[6,12],prefecture:'東京都',age:30,dependents:0,specificDependents:0,elderDependents:0,spouse:false});
          assert.deepEqual([takeHome.gross,takeHome.social.total,takeHome.incomeTax,takeHome.residentTax,takeHome.annualNet,takeHome.monthlyNet],[4200000,616575,64476,189700,3329249,277437]);
          NODE
          python3 <<'PY'
          from pathlib import Path
          import json,re,xml.etree.ElementTree as ET
          for path in Path('.').rglob('*.html'):
              text=path.read_text(encoding='utf-8')
              ids=re.findall(r'\bid="([^"]+)"',text)
              assert len(ids)==len(set(ids)), f'duplicate id: {path}'
              for block in re.findall(r'<script type="application/ld\+json">(.*?)</script>',text,re.S):
                  json.loads(block)
          root=ET.parse('sitemap.xml')
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs=[x.text for x in root.findall('s:url/s:loc',ns)]
          assert 'https://imaikura.com/salary-take-home/' in locs
          assert 'https://imaikura.com/bonus-take-home/' in locs
          PY
          grep -q '2026年中に40歳または65歳になる場合' salary-take-home/index.html
          grep -q 'id="paymentMonth"' bonus-take-home/index.html
          grep -q '2026年9月1日確認' salary-take-home/index.html
          grep -q '2026年9月1日確認' bonus-take-home/index.html

      - name: Commit correction and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/audit-payload .github/workflows/social-insurance-audit-fix.yml
          git config user.name "imaikura-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "[social-insurance-audit-fix] Apply 2026 effective-month rates"
          git push origin HEAD:main
