name: One-off retirement calculation audit fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retirement-audit-fix.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified Japanese retirement-tax corrections
        shell: bash
        run: |
          set -euo pipefail
