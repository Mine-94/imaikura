          assertEqual(result.taxationCategory,'shortTerm','short-term category');
          assertEqual(result.taxableRetirementIncome,2500000,'short-term taxable income');
          result = tax.retirementIncome2026({retirementPay:6000000,years:5,months:0,declarationSubmitted:true,isOfficer:true});
          assertEqual(result.taxationCategory,'specifiedOfficer','officer category');
          assertEqual(result.taxableRetirementIncome,4000000,'specified officer taxable income');
          result = tax.retirementIncome2026({retirementPay:10000000,years:20,months:0,declarationSubmitted:false,isOfficer:false});
          assertEqual(result.withheldIncomeTax,2042000,'unsubmitted declaration withholding');
          assertEqual(result.settlementDifference,1990950,'filing refund estimate');
          assertEqual(result.finalNetAfterSettlement,9848950,'final net after settlement');
          NODE

