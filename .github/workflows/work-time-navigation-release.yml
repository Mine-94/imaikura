name: One-off work-time navigation release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/work-time-navigation-release.yml

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch homepage, related links and sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          if 'href="work-time/"' not in html:
              marker = '<a class="tool-card" href="income-wall/"'
              position = html.find(marker)
              if position < 0:
                  raise SystemExit('income-wall card marker not found')
              card = '''<a class="tool-card" href="work-time/" data-search="勤務時間 労働時間 実労働時間 休憩 休憩時間 始業 終業 夜勤 翌日 タイムカード">
          <div class="tool-card-top"><span class="tool-no">TOOL 00</span><span class="status">休憩基準対応</span></div>
          <h2>勤務時間・休憩時間計算</h2>
          <p>始業・終業時刻と休憩時間から実労働時間を計算し、法定最低休憩時間と不足時間を確認します。</p>
          <span class="card-link">勤務時間を計算する</span>
          </a>
          '''
              html = html[:position] + card + html[position:]

          html = html.replace(
              '給与・年収の手取り、社会保険料、残業代、住民税、年末調整、ふるさと納税、住宅ローン控除などを無料で計算。',
              '給与・年収の手取り、社会保険料、残業代、勤務時間、住民税、年末調整、ふるさと納税、住宅ローン控除などを無料で計算。'
          )
          html = re.sub(
              r'placeholder="例：[^"]+"',
              'placeholder="例：手取り、社会保険料、残業代、勤務時間"',
              html,
              count=1
          )
          html = re.sub(
              r'<p>給料、社会保険、賞与、残業、(?:勤務時間、)?扶養、退職金を確認</p>',
              '<p>給料、社会保険、賞与、残業、勤務時間、扶養、退職金を確認</p>',
              html,
              count=1
          )

          counter = 0
          def renumber(match):
              global counter
              counter += 1
              return f'<span class="tool-no">TOOL {counter:02d}</span>'
          html = re.sub(r'<span class="tool-no">TOOL \d+</span>', renumber, html)

          searchable_count = html.count('data-search=')
          if searchable_count != counter:
              raise SystemExit(f'tool-card count mismatch: search={searchable_count}, numbered={counter}')
          html = re.sub(r'>\d+件の計算ツールを表示中<', f'>{searchable_count}件の計算ツールを表示中<', html, count=1)
          html = re.sub(r'<span>現在 \d+ツール公開中</span>', f'<span>現在 {searchable_count}ツール公開中</span>', html, count=1)
          html = re.sub(r'<span>法令・制度の最終確認：\d{4}年\d+月\d+日</span>', '<span>法令・制度の最終確認：2026年9月2日</span>', html, count=1)
          index_path.write_text(html, encoding='utf-8')

          overtime_path = Path('overtime-pay/index.html')
          overtime = overtime_path.read_text(encoding='utf-8')
          if 'href="../work-time/"' not in overtime:
              marker = '          <a class="tool-card" href="../salary-take-home/"'
              position = overtime.find(marker)
              if position < 0:
                  raise SystemExit('overtime related-card marker not found')
              card = '          <a class="tool-card" href="../work-time/"><h2>勤務時間・休憩時間計算</h2><p>始業・終業・休憩から実労働時間と法定最低休憩時間を確認。</p><span class="card-link">勤務時間を計算する</span></a>\n'
              overtime = overtime[:position] + card + overtime[position:]
          overtime = re.sub(r'最終確認日：\d{4}年\d+月\d+日', '最終確認日：2026年9月2日', overtime, count=1)
          overtime_path.write_text(overtime, encoding='utf-8')

          sitemap_path = Path('sitemap.xml')
          sitemap = sitemap_path.read_text(encoding='utf-8')
          sitemap = re.sub(
              r'(<loc>https://imaikura\.com/overtime-pay/</loc><lastmod>)\d{4}-\d{2}-\d{2}(</lastmod>)',
              r'\g<1>2026-09-02\g<2>',
              sitemap,
              count=1
          )
          if 'https://imaikura.com/work-time/' not in sitemap:
              overtime_entry = re.search(r'\s*<url><loc>https://imaikura\.com/overtime-pay/</loc><lastmod>[^<]+</lastmod></url>', sitemap)
              if not overtime_entry:
                  raise SystemExit('overtime sitemap entry not found')
              entry = '\n  <url><loc>https://imaikura.com/work-time/</loc><lastmod>2026-09-02</lastmod></url>'
              sitemap = sitemap[:overtime_entry.end()] + entry + sitemap[overtime_entry.end():]
          sitemap_path.write_text(sitemap, encoding='utf-8')
          PY

      - name: Validate navigation changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          count = html.count('data-search=')
          assert count >= 14, count
          assert html.count('href="work-time/"') == 1
          assert f'現在 {count}ツール公開中' in html
          numbers = re.findall(r'<span class="tool-no">TOOL (\d+)</span>', html)
          assert numbers == [f'{i:02d}' for i in range(1, count + 1)], numbers
          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          assert sitemap.count('https://imaikura.com/work-time/') == 1
          assert Path('work-time/index.html').exists()
          assert Path('assets/work-time-engine.js').exists()
          assert 'href="../work-time/"' in Path('overtime-pay/index.html').read_text(encoding='utf-8')
          PY

      - name: Commit release navigation
        shell: bash
        run: |
          git config user.name "imaikura-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/work-time-navigation-release.yml
          git add index.html overtime-pay/index.html sitemap.xml
          git commit -m "Publish work-time calculator across site navigation"
          git push
