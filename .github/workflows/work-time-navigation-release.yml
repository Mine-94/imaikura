name: One-off work-time navigation release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/work-time-navigation-release.yml

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch homepage, related links and sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new)

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          pairs = [
              ('給与・年収の手取り、残業代、住民税、年末調整、ふるさと納税、住宅ローン控除などを無料で計算。',
               '給与・年収の手取り、残業代、勤務時間、住民税、年末調整、ふるさと納税、住宅ローン控除などを無料で計算。', 'description'),
              ('placeholder="例：手取り、住民税、残業代、住宅ローン"',
               'placeholder="例：手取り、残業代、勤務時間、住民税"', 'search placeholder'),
              ('>12件の計算ツールを表示中<', '>13件の計算ツールを表示中<', 'initial tool count'),
              ('<p>給料、賞与、残業、扶養、退職金を確認</p>',
               '<p>給料、賞与、残業、勤務時間、扶養、退職金を確認</p>', 'section summary'),
              ('<div class="tool-card-top"><span class="tool-no">TOOL 05</span><span class="status">2026年10月改正予定</span></div>',
               '<div class="tool-card-top"><span class="tool-no">TOOL 06</span><span class="status">2026年10月改正予定</span></div>', 'income-wall number'),
              ('<div class="tool-card-top"><span class="tool-no">TOOL 06</span><span class="status">2026年分対応</span></div>',
               '<div class="tool-card-top"><span class="tool-no">TOOL 07</span><span class="status">2026年分対応</span></div>', 'retirement number'),
              ('<div class="tool-card-top"><span class="tool-no">TOOL 07</span><span class="status">令和8年度対応</span></div>',
               '<div class="tool-card-top"><span class="tool-no">TOOL 08</span><span class="status">令和8年度対応</span></div>', 'resident tax number'),
              ('<div class="tool-card-top"><span class="tool-no">TOOL 08</span><span class="status">令和8年度基準</span></div>',
               '<div class="tool-card-top"><span class="tool-no">TOOL 09</span><span class="status">令和8年度基準</span></div>', 'exemption number'),
              ('<div class="tool-card-top"><span class="tool-no">TOOL 09</span><span class="status">確定申告対応</span></div>',
               '<div class="tool-card-top"><span class="tool-no">TOOL 10</span><span class="status">確定申告対応</span></div>', 'medical number'),
              ('<div class="tool-card-top"><span class="tool-no">TOOL 10</span><span class="status">2026年改正対応</span></div>',
               '<div class="tool-card-top"><span class="tool-no">TOOL 11</span><span class="status">2026年改正対応</span></div>', 'housing number'),
              ('<div class="tool-card-top"><span class="tool-no">TOOL 11</span><span class="status">計算式更新</span></div>',
               '<div class="tool-card-top"><span class="tool-no">TOOL 12</span><span class="status">計算式更新</span></div>', 'furusato number'),
              ('<div class="tool-card-top"><span class="tool-no">TOOL 12</span><span class="status">標準10%・軽減8%</span></div>',
               '<div class="tool-card-top"><span class="tool-no">TOOL 13</span><span class="status">標準10%・軽減8%</span></div>', 'consumption number'),
              ('<span>法令・制度の最終確認：2026年9月1日</span>',
               '<span>法令・制度の最終確認：2026年9月2日</span>', 'homepage check date'),
              ('<span>現在 12ツール公開中</span>', '<span>現在 13ツール公開中</span>', 'published count'),
          ]
          for old, new, label in pairs:
              html = replace_once(html, old, new, label)

          anchor = '<a class="tool-card" href="income-wall/" data-search="年収の壁 扶養 106万 110万 123万 130万 178万 社会保険 パート アルバイト">'
          card = '''<a class="tool-card" href="work-time/" data-search="勤務時間 労働時間 実労働時間 休憩 休憩時間 始業 終業 夜勤 翌日 タイムカード">
          <div class="tool-card-top"><span class="tool-no">TOOL 05</span><span class="status">休憩基準対応</span></div>
          <h2>勤務時間・休憩時間計算</h2>
          <p>始業・終業時刻と休憩時間から実労働時間を計算し、法定最低休憩時間と不足時間を確認します。</p>
          <span class="card-link">勤務時間を計算する</span>
          </a>
          '''
          html = replace_once(html, anchor, card + anchor, 'work-time card insertion')
          index_path.write_text(html, encoding='utf-8')

          overtime_path = Path('overtime-pay/index.html')
          overtime = overtime_path.read_text(encoding='utf-8')
          related_anchor = '          <a class="tool-card" href="../salary-take-home/"><h2>給与・年収の手取り計算</h2><p>社会保険料・所得税・住民税を差し引いた年間手取りを確認。</p><span class="card-link">手取りを計算する</span></a>'
          work_card = '          <a class="tool-card" href="../work-time/"><h2>勤務時間・休憩時間計算</h2><p>始業・終業・休憩から実労働時間と法定最低休憩時間を確認。</p><span class="card-link">勤務時間を計算する</span></a>\n'
          overtime = replace_once(overtime, related_anchor, work_card + related_anchor, 'overtime related link')
          overtime = replace_once(overtime, '最終確認日：2026年9月1日', '最終確認日：2026年9月2日', 'overtime check date')
          overtime_path.write_text(overtime, encoding='utf-8')

          sitemap_path = Path('sitemap.xml')
          sitemap = sitemap_path.read_text(encoding='utf-8')
          sitemap = replace_once(
              sitemap,
              '<url><loc>https://imaikura.com/</loc><lastmod>2026-09-01</lastmod></url>',
              '<url><loc>https://imaikura.com/</loc><lastmod>2026-09-02</lastmod></url>',
              'sitemap root date'
          )
          old_overtime = '<url><loc>https://imaikura.com/overtime-pay/</loc><lastmod>2026-09-01</lastmod></url>'
          new_entries = '<url><loc>https://imaikura.com/overtime-pay/</loc><lastmod>2026-09-02</lastmod></url>\n<url><loc>https://imaikura.com/work-time/</loc><lastmod>2026-09-02</lastmod></url>'
          sitemap = replace_once(sitemap, old_overtime, new_entries, 'sitemap work-time entry')
          sitemap_path.write_text(sitemap, encoding='utf-8')
          PY

      - name: Validate navigation changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('class="tool-card"') >= 13
          assert html.count('data-search=') == 13
          assert 'href="work-time/"' in html
          assert '現在 13ツール公開中' in html
          nums = re.findall(r'<span class="tool-no">(TOOL \d+)</span>', html)
          assert nums == [f'TOOL {i:02d}' for i in range(1, 14)], nums
          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          assert sitemap.count('https://imaikura.com/work-time/') == 1
          assert Path('work-time/index.html').exists()
          assert Path('assets/work-time-engine.js').exists()
          PY

      - name: Commit release navigation
        shell: bash
        run: |
          git config user.name "imaikura-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/work-time-navigation-release.yml
          git add index.html overtime-pay/index.html sitemap.xml
          git commit -m "Publish work-time calculator across site navigation"
          git push
