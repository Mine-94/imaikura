name: Publish 2026 minimum wage guide

on:
  push:
    branches:
      - seo/minimum-wage-2026-20260904
    paths:
      - .github/workflows/minimum-wage-2026-release.yml

permissions:
  contents: write

concurrency:
  group: imaikura-minimum-wage-2026-release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified release package
        shell: bash
        run: |
          set -euo pipefail
          cat .release/minwage-payload-00 .release/minwage-payload-01 .release/minwage-payload-02 .release/minwage-payload-03 > /tmp/minwage-release.tar.gz.b64
          base64 --decode /tmp/minwage-release.tar.gz.b64 > /tmp/minwage-release.tar.gz
          echo '438e1a47fea21c768498030dd1952d270dadc2a9ac106569f86ec7827d4f0e08  /tmp/minwage-release.tar.gz' | sha256sum --check --strict
          tar -tzf /tmp/minwage-release.tar.gz >/dev/null
          tar -xzf /tmp/minwage-release.tar.gz -C .

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          from collections import Counter
          import json
          import re
          import xml.etree.ElementTree as ET

          root = Path('.')
          page = (root / 'minimum-wage-2026/index.html').read_text(encoding='utf-8')
          assert page.count('<h1') == 1
          assert 'https://imaikura.com/minimum-wage-2026/' in page
          assert page.count('data-prefecture=') == 47
          prefs = re.findall(r'data-prefecture="([^"]+)"', page)
          assert len(prefs) == 47 and len(set(prefs)) == 47
          increases = map(int, re.findall(r'data-increase="(\d+)"', page))
          assert Counter(increases) == Counter({56:11,57:7,59:5,58:4,60:4,61:4,54:3,55:3,62:2,63:2,64:1,65:1})
          for block in re.findall(r'<script[^>]+type="application/ld\+json"[^>]*>(.*?)</script>', page, re.S):
              json.loads(block)

          home = (root / 'index.html').read_text(encoding='utf-8')
          assert home.count('data-search=') == 15
          assert len(re.findall(r'>GUIDE \d{2}<', home)) == 8
          assert home.count('href="minimum-wage-2026/"') == 1
          assert '現在 15ツール・9ガイド公開中' in home
          assert (root / 'site-map/index.html').read_text(encoding='utf-8').count('../minimum-wage-2026/') == 1
          assert (root / 'wage-converter/index.html').read_text(encoding='utf-8').count('../minimum-wage-2026/') == 1

          rss = ET.parse('feed.xml').getroot()
          items = rss.findall('./channel/item')
          assert len(items) == 9 and items[0].findtext('link') == 'https://imaikura.com/minimum-wage-2026/'

          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [e.text.strip() for e in ET.parse('sitemap.xml').findall('s:url/s:loc', ns)]
          assert len(urls) == 31 and len(urls) == len(set(urls))
          assert 'https://imaikura.com/minimum-wage-2026/' in urls
          for url in urls:
              path = urlparse(url).path
              target = root / 'index.html' if path == '/' else root / path.lstrip('/') / 'index.html'
              assert target.exists(), (url, target)

          assert '2026年度最低賃金の47都道府県一覧を公開' in (root / 'updates/index.html').read_text(encoding='utf-8')
          print('minimum wage release validation: PASS')
          PY

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "imaikura-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/minimum-wage-2026-release.yml .release/minwage-payload-*
          git add minimum-wage-2026/index.html index.html site-map/index.html updates/index.html wage-converter/index.html feed.xml sitemap.xml
          git commit -m "Publish 2026 minimum wage prefecture guide"
          git push origin HEAD:seo/minimum-wage-2026-20260904
