name: One-off wage converter release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wage-converter-release.yml

permissions:
  contents: write

concurrency:
  group: imaikura-one-off-content-release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore audited release package
        shell: bash
        run: |
          set -euo pipefail
          cat .release/wage-payload-00 .release/wage-payload-01 .release/wage-payload-02a{0..9} .release/wage-payload-02b .release/wage-payload-03 .release/wage-payload-04 > /tmp/wage-release.tar.gz.b64
          base64 --decode /tmp/wage-release.tar.gz.b64 > /tmp/wage-release.tar.gz
          echo '19acf8528821fe7c76eacb3bcda9621c4b499717bfbfd2d4088066f7b6ec5431  /tmp/wage-release.tar.gz' | sha256sum --check --strict
          tar -tzf /tmp/wage-release.tar.gz >/dev/null
          tar -xzf /tmp/wage-release.tar.gz -C .

      - name: Validate calculator engine and site integration
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/wage-converter-engine.js
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          required = [
              Path('assets/wage-converter-engine.js'),
              Path('wage-converter/index.html'),
              Path('index.html'),
              Path('sitemap.xml'),
              Path('salary-take-home/index.html'),
              Path('overtime-pay/index.html'),
              Path('work-time/index.html'),
          ]
          assert all(path.exists() for path in required)

          page = Path('wage-converter/index.html').read_text(encoding='utf-8')
          assert page.count('<h1') == 1
          assert 'https://imaikura.com/wage-converter/' in page
          assert '../assets/wage-converter-engine.js' in page
          assert '厚生労働省' in page
          assert '最低賃金' in page
          for block in re.findall(r'<script type="application/ld\+json">(.*?)</script>', page, re.S):
              json.loads(block)
          ids = re.findall(r'\sid="([^"]+)"', page)
          assert len(ids) == len(set(ids)), 'duplicate ids found'

          home = Path('index.html').read_text(encoding='utf-8')
          count = home.count('data-search=')
          assert count == 15, count
          assert home.count('href="wage-converter/"') == 1
          assert '15件の計算ツールを表示中' in home
          assert '現在 15ツール公開中' in home
          numbers = re.findall(r'<span class="tool-no">TOOL (\d+)</span>', home)
          assert numbers == [f'{i:02d}' for i in range(1, 16)], numbers

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          assert sitemap.count('https://imaikura.com/wage-converter/') == 1
          for related in ('salary-take-home/index.html', 'overtime-pay/index.html', 'work-time/index.html'):
              assert Path(related).read_text(encoding='utf-8').count('href="../wage-converter/"') == 1
          PY

          node <<'JS'
          const assert = require('assert');
          const wage = require('./assets/wage-converter-engine.js');

          let r = wage.calculateWageConversion({mode:'monthly', amount:240000, dailyHours:8, annualWorkDays:250, annualBonus:0, minimumWage:0});
          assert.strictEqual(r.annualScheduledHours, 2000);
          assert.strictEqual(r.hourlyEquivalent, 1440);
          assert.strictEqual(r.annualBase, 2880000);

          r = wage.calculateWageConversion({mode:'hourly', amount:1500, dailyHours:8, annualWorkDays:250, annualBonus:400000, minimumWage:1226});
          assert.strictEqual(r.dailyEquivalent, 12000);
          assert.strictEqual(r.monthlyEquivalent, 250000);
          assert.strictEqual(r.annualBase, 3000000);
          assert.strictEqual(r.totalAnnual, 3400000);
          assert.strictEqual(r.minimumWageComparison.meetsOrExceeds, true);

          r = wage.calculateWageConversion({mode:'annual', amount:3600000, dailyHours:7, annualWorkDays:250, annualBonus:600000, minimumWage:1800});
          assert.strictEqual(r.annualScheduledHours, 1750);
          assert.strictEqual(r.hourlyEquivalent, 3000000 / 1750);
          assert.strictEqual(r.minimumWageComparison.meetsOrExceeds, false);

          r = wage.calculateWageConversion({mode:'monthly', amount:300000, dailyHours:7, annualWorkDays:250, annualHoursOverride:1700, annualBonus:0});
          assert.strictEqual(r.annualScheduledHours, 1700);
          assert.strictEqual(r.annualHoursSource, 'override');

          assert.throws(() => wage.calculateWageConversion({mode:'annual', amount:300000, annualBonus:400000, dailyHours:8, annualWorkDays:250}), /賞与/);
          assert.throws(() => wage.calculateWageConversion({mode:'monthly', amount:0, dailyHours:8, annualWorkDays:250}), /賃金額/);
          console.log('wage converter release tests: PASS');
          JS

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "imaikura-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/wage-converter-release.yml .release/wage-payload-*
          git add assets/wage-converter-engine.js wage-converter/index.html index.html sitemap.xml salary-take-home/index.html overtime-pay/index.html work-time/index.html
          git commit -m "Add wage conversion and minimum-wage comparison tool"
          git push
